# Runs buzz-relay as a container alongside the dev stack in docker-compose.yml,
# so the relay starts automatically with Docker Desktop and needs no terminal.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.relay.yml up -d
#
# Deliberately NOT deploy/compose/compose.yml: that bundle brings its own
# Postgres/Redis/MinIO on the same ports with separate volumes, which would
# shadow the dev database (community rows, channels, identity). This override
# adds only the relay and points it at the dev services already holding that
# data.
#
# Stop the host-run relay before starting this -- both bind port 3000.
#
# env_file supplies BUZZ_RELAY_PRIVATE_KEY (so the relay keeps its identity
# across host/container runs) and everything else from .env. The `environment`
# block below then overrides the infra URLs: .env points at 127.0.0.1 for host
# processes, but inside the compose network the services resolve by name.
# Compose gives `environment` precedence over `env_file`.

name: buzz

services:
  relay:
    image: ghcr.io/block/buzz:main
    container_name: buzz-relay
    env_file:
      - .env
    environment:
      BUZZ_BIND_ADDR: 0.0.0.0:3000
      BUZZ_HEALTH_PORT: "8080"
      BUZZ_METRICS_PORT: "9102"
      DATABASE_URL: postgres://buzz:buzz_dev@postgres:5432/buzz
      PGHOST: postgres
      # The dev Redis runs without a password, unlike deploy/compose.
      REDIS_URL: redis://redis:6379
      BUZZ_S3_ENDPOINT: http://minio:9000
      # Docker DNS resolves `minio`, not `<bucket>.minio`, so addressing must be path-style.
      BUZZ_S3_ADDRESSING_STYLE: path
      BUZZ_S3_ACCESS_KEY: buzz_dev
      BUZZ_S3_SECRET_KEY: buzz_dev_secret
      BUZZ_S3_BUCKET: buzz-media
      BUZZ_GIT_REPO_PATH: /data/git
      RELAY_URL: ws://localhost:3000
      # Migrations are owned by `cargo run -p buzz-admin -- migrate` on the host.
      BUZZ_AUTO_MIGRATE: "false"
    ports:
      - "3000:3000"
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9102:9102"
    volumes:
      - git-data:/data/git
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    # The runtime image has bash but no curl/wget, so probe over /dev/tcp.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET /_readiness HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\nConnection: close\\r\\n\\r\\n\" >&3; grep -q \"200 OK\" <&3'",
        ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    networks:
      - buzz-net
    labels:
      com.buzz.service: "relay"
      com.buzz.env: "dev"

volumes:
  git-data:
    name: buzz-git-data
    labels:
      com.buzz.volume: "git"
