[advisories]
ignore = [
    # instant 0.1.13 — unmaintained crate. Transitive dep: nostr → instant.
    # Will be resolved when nostr crate updates its dependencies.
    { id = "RUSTSEC-2024-0384", reason = "transitive dep via nostr; no upstream fix available" },
    # paste 1.0.15 — unmaintained. Transitive dep: mesh-llm → iroh → netlink-* → paste.
    # No safe upgrade available; tracked for upstream (iroh/netlink) replacement.
    { id = "RUSTSEC-2024-0436", reason = "transitive dep via mesh-llm → iroh → netlink; no upstream fix available" },
    # quick-xml < 0.41: quadratic runtime on duplicate-attribute check (0194) and
    # unbounded namespace-declaration allocation in NsReader (0195). Both DoS-class,
    # requiring attacker-controlled XML. Our two locked versions only parse trusted
    # input: 0.38.4 (rust-s3/aws-creds — responses from our own S3/MinIO endpoint)
    # and 0.39.4 (mesh-llm → iroh → netdev → plist — local macOS system plists).
    # Patched release (>= 0.41.0) is unreachable until rust-s3 and plist/netdev bump;
    # remove these when upstream catches up.
    { id = "RUSTSEC-2026-0194", reason = "transitive via rust-s3 and mesh-llm→plist; trusted-input XML only; no upstream fix available yet" },
    { id = "RUSTSEC-2026-0195", reason = "transitive via rust-s3 and mesh-llm→plist; trusted-input XML only; no upstream fix available yet" },
    # Desktop workspace (desktop/src-tauri) — unmaintained crates with no safe upgrade.
    # audiopus_sys: via `opus` 0.3 (huddle Opus decoder); fix is switching Opus bindings.
    { id = "RUSTSEC-2026-0150", reason = "desktop: audiopus_sys via opus; no maintained replacement adopted yet" },
    # mach 0.1.2 / 0.3.2: via `user-idle` 0.6 (macOS idle detection).
    { id = "RUSTSEC-2020-0168", reason = "desktop: mach via user-idle; no upstream fix available" },
    # proc-macro-error: via tauri → tray-icon → gtk 0.18 → glib-macros (Linux only).
    { id = "RUSTSEC-2024-0370", reason = "desktop: proc-macro-error via tauri's gtk 0.18 stack; waits on tauri" },
    # unic-*: via tauri-utils → urlpattern 0.3.
    { id = "RUSTSEC-2025-0075", reason = "desktop: unic-char-range via tauri-utils → urlpattern; waits on tauri" },
    { id = "RUSTSEC-2025-0080", reason = "desktop: unic-common via tauri-utils → urlpattern; waits on tauri" },
    { id = "RUSTSEC-2025-0081", reason = "desktop: unic-char-property via tauri-utils → urlpattern; waits on tauri" },
    { id = "RUSTSEC-2025-0098", reason = "desktop: unic-ucd-version via tauri-utils → urlpattern; waits on tauri" },
    { id = "RUSTSEC-2025-0100", reason = "desktop: unic-ucd-ident via tauri-utils → urlpattern; waits on tauri" },
    # unsafe-libyaml 0.2.11 — unmaintained (repository archived 2024-03-25), not a
    # vulnerability report. Transitive dep: serde_yaml → unsafe-libyaml. The serde_yaml_ng
    # fork uses the same crate, so removing it means migrating YAML parsing in
    # buzz-agent, buzz-persona, buzz-relay, buzz-workflow and desktop.
    { id = "RUSTSEC-2024-0449", reason = "transitive via serde_yaml; unmaintained, not vulnerable; removal needs a YAML parser migration" },
    # NetEQ =0.8.3 declares ringbuf but its published Rust sources never use it,
    # so Consumer::skip/clear and their panic-unsafe Drop path are unreachable.
    # NetEQ 0.9.1 still declares ringbuf 0.3; ringbuf itself is fixed in 0.5.2.
    # Keep the exact NetEQ pin and the wrapper ban below together. Re-audit or
    # remove this exception when NetEQ removes/updates the unused dependency.
    { id = "RUSTSEC-2026-0293", reason = "unused dependency of audited, exactly pinned neteq 0.8.3; no Rust references to ringbuf; other consumers forbidden by bans.deny" },
    # rmcp < 3.9.0: the Streamable HTTP clients read non-streaming response bodies into memory with no size limit, so a
    # malicious or compromised MCP server can exhaust the client's memory. The only patched range is >= 3.9.0; rmcp 1.x
    # has no fix. rmcp 1.8.0 reaches us only via buzz-agent, which compiles just its client and transport-child-process
    # features. The code the advisory names sits behind transport-streamable-http-client* and __reqwest, which are off,
    # so the HTTP transport is not built. This id-level ignore would also hide a 3.x copy, so rmcp 3.x must stay at
    # >= 3.9.0. Remove when buzz-agent moves to rmcp >= 3.9.
    { id = "RUSTSEC-2026-0462", reason = "rmcp 1.8.0 via buzz-agent compiles only client and transport-child-process, so the affected HTTP client is not built; no 1.x fix; rmcp 3.x must stay >= 3.9.0" },
    # libsqlite3-sys < 0.39 bundles SQLite < 3.54.0, which can return uninitialized page-cache memory when it opens a
    # database with a sibling -wal file of a different page size (CVE-2026-119375): a crafted pair makes ordinary queries
    # return stale bytes from the process's memory. No tagged upgrade resolves: the fix needs libsqlite3-sys >= 0.39 (rusqlite
    # >= 0.41), mesh-llm-log-store requires rusqlite ^0.40 through mesh-llm v0.78.1, libsqlite3-sys's links = "sqlite3"
    # allows one copy, and the patched sqlx-sqlite caps it below 0.39. The risk is accepted, not absent: the desktop opens
    # archive/archive.db inside the nest at every start, and the nest is the working directory of spawned agents, so a
    # sandboxed agent able to write there could plant the db and -wal pair. The app's other databases are outside the
    # nest. Remove when libsqlite3-sys >= 0.39 resolves: that needs a tagged mesh-llm allowing rusqlite >= 0.41, the
    # desktop's own rusqlite moving with it, and a sqlx-sqlite pin allowing libsqlite3-sys >= 0.39.
    { id = "RUSTSEC-2026-0459", reason = "risk accepted, not absent: no upgrade until a tagged mesh-llm allows rusqlite >= 0.41, and the desktop opens archive.db inside the nest, where a sandboxed agent could plant a crafted db and -wal pair" },
    # zip < 9: ZipArchive::extract aborts the process on a symlink entry with a large declared size. Fixed only in 9.0.0.
    # Same copies and reasoning as 0367-0369 below. 8.6.0 via mesh-llm v0.76.2 (root via buzz-mesh-smoke; desktop via the
    # mesh-llm feature, off in Dreamforge releases): its readers never call extract(). 4.6.1 via tauri-plugin-updater (Windows):
    # extract() only sees bytes that passed the signature check in download(), and we ship .exe updates, not zips.
    # Our own use is zip 9. Remove when a tagged mesh-llm is on zip 9 and the updater is >= 2.14.1.
    { id = "RUSTSEC-2026-0429", reason = "zip 8.6.0 via mesh-llm v0.76.2 never calls extract(); zip 4.6.1 via tauri-plugin-updater extracts only signature-checked bytes, and we ship .exe updates" },
    # zip < 9 (0367 SUID bits kept, 0368 symlinks escaping the destination, 0369 permissions
    # applied through symlinks): all three are in ZipArchive::extract / ZipStreamReader::extract.
    # The desktop's own reader (managed_node.rs) is on zip 9 since upstream #8412. zip 8.6.0 stays
    # via mesh-llm v0.76.2 (mesh-llm-host-runtime / -plugin-manager / -system; root via
    # buzz-mesh-smoke, desktop via the mesh-llm feature): its readers copy entry by entry with
    # enclosed_name() and never call extract(); the fix is Mesh-LLM/mesh-llm#2471. zip 4.6.1 stays
    # via tauri-plugin-updater 2.10.1 (desktop): extract_zip() calls extract() for a zip update on
    # Windows, but only after verify_signature() passes, and our releases ship signed NSIS .exe
    # updates, not zips. Remove when mesh-llm and tauri-plugin-updater move to zip 9.
    { id = "RUSTSEC-2026-0367", reason = "zip 8.6.0 via mesh-llm v0.76.2 copies entries via enclosed_name(), never extracts; zip 4.6.1 via tauri-plugin-updater extracts only after a signature check, and we ship .exe updates" },
    { id = "RUSTSEC-2026-0368", reason = "zip 8.6.0 via mesh-llm v0.76.2 copies entries via enclosed_name(), never extracts; zip 4.6.1 via tauri-plugin-updater extracts only after a signature check, and we ship .exe updates" },
    { id = "RUSTSEC-2026-0369", reason = "zip 8.6.0 via mesh-llm v0.76.2 copies entries via enclosed_name(), never extracts; zip 4.6.1 via tauri-plugin-updater extracts only after a signature check, and we ship .exe updates" },
    # zvariant / zvariant_derive / zbus_names: unmaintained, "no safe upgrade" (zbus issue 2043).
    # Linux-only D-Bus stack via notify-rust, tauri notification/opener/single-instance plugins
    # and the secret-service keyring store (desktop), and mesh-llm → keyring 4 (root).
    { id = "RUSTSEC-2026-0370", reason = "zvariant via the Linux D-Bus stack (zbus); unmaintained, no safe upgrade" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names via the Linux D-Bus stack (zbus); unmaintained, no safe upgrade" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive via the Linux D-Bus stack (zbus); unmaintained, no safe upgrade" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "OpenSSL",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "MITNFA",
    "MPL-2.0",
    "BSL-1.0",
    "Unlicense",
    # minicbor's permissive, OSI-approved license. Used for strict App Attest
    # assertion CBOR parsing and also transitively by appattest.
    "BlueOak-1.0.0",
    # bzip2/libbzip2's permissive BSD-like license. New via desktop zip/bzip2
    # transitive deps; compatible with Apache-2.0 distribution.
    "bzip2-1.0.6",
]
confidence-threshold = 0.8

# mesh-llm workspace crates (pinned git dep) omit a per-crate `license` field in
# their manifests, so cargo-deny reports them as unlicensed. The mesh-llm repo is
# licensed "MIT OR Apache-2.0" (workspace Cargo.toml + top-level LICENSE = Apache-2.0);
# clarify each pulled-in member to that expression. Remove once mesh sets the field
# upstream (filed).
[[licenses.clarify]]
crate = "mesh-llm-config"
expression = "MIT OR Apache-2.0"
license-files = []

[[licenses.clarify]]
crate = "mesh-llm-gpu-bench"
expression = "MIT OR Apache-2.0"
license-files = []

[[licenses.clarify]]
crate = "mesh-llm-host-runtime"
expression = "MIT OR Apache-2.0"
license-files = []

[[licenses.clarify]]
crate = "mesh-llm-plugin"
expression = "MIT OR Apache-2.0"
license-files = []

[[licenses.clarify]]
crate = "mesh-llm-system"
expression = "MIT OR Apache-2.0"
license-files = []

[[licenses.clarify]]
crate = "mesh-mixture-of-agents"
expression = "MIT OR Apache-2.0"
license-files = []

[[licenses.clarify]]
crate = "buzz-desktop"
expression = "Apache-2.0"
license-files = []

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"
deny = [
    { name = "ringbuf", version = "<0.5.2", wrappers = ["neteq"], reason = "only audited NetEQ may declare this unused vulnerable dependency; all other consumers must use a patched release" },
]
