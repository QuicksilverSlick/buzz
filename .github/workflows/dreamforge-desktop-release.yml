name: Dreamforge desktop release

# Builds Dreamforge for macOS (Apple Silicon and Intel) and Windows. A manual run
# with publish=true uploads the installers and latest.json to the rolling release
# dreamforge-desktop-latest, which installed apps poll for updates. Pull requests
# touching this file only build; their installers are run artifacts.
#
# Updater signing needs the TAURI_SIGNING_PRIVATE_KEY secret: the minisign key whose
# public half is desktop/src-tauri/dreamforge-updater.pub, with an empty password.
# Without it builds still produce installers but no updater archives, and publish refuses.
#
# macOS builds are ad-hoc signed and not notarized (no Apple Developer account).

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version, plain x.y.z, newer than the published one
        required: true
        type: string
      publish:
        description: Upload to the dreamforge-desktop-latest release
        type: boolean
        default: false
  pull_request:
    paths:
      - .github/workflows/dreamforge-desktop-release.yml
      - scripts/release-latest-json.py

concurrency:
  group: dreamforge-desktop-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  BUZZ_UPDATER_ENDPOINT: https://github.com/QuicksilverSlick/buzz/releases/download/dreamforge-desktop-latest/latest.json
  VERSION: ${{ inputs.version }}
  PUBLISH: ${{ inputs.publish }}
  HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}

jobs:
  macos:
    name: macOS ${{ matrix.arch }}
    if: github.repository == 'QuicksilverSlick/buzz'
    runs-on: macos-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: aarch64
          - target: x86_64-apple-darwin
            arch: x64
    env:
      TARGET: ${{ matrix.target }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: ${{ matrix.target }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.1
          package-manager-cache: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.4.0

      - name: Install desktop dependencies
        run: pnpm install --frozen-lockfile

      - name: Set version
        if: env.VERSION != ''
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::version must be plain x.y.z, got '$VERSION'"; exit 1; }
          # Fail in minutes, not after the builds, when a publish would be refused.
          [ "$PUBLISH" != true ] || python3 scripts/release-latest-json.py --check "$VERSION" "$BUZZ_UPDATER_ENDPOINT"
          cd desktop && node scripts/set-version-from-tag.mjs "$VERSION"
          cd src-tauri && cargo update --workspace

      - name: Generate release config
        run: |
          if [ "$HAS_UPDATER_KEY" != true ]; then
            [ "$PUBLISH" != true ] || { echo "::error::publish needs the TAURI_SIGNING_PRIVATE_KEY secret"; exit 1; }
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set; building without updater artifacts"
          fi
          BUZZ_UPDATER_PUBLIC_KEY=$(cat desktop/src-tauri/dreamforge-updater.pub)
          export BUZZ_UPDATER_PUBLIC_KEY
          echo "BUZZ_UPDATER_PUBLIC_KEY=$BUZZ_UPDATER_PUBLIC_KEY" >> "$GITHUB_ENV"
          cd desktop && node scripts/build-release-config.mjs
          # Ad-hoc signature ("-"): Apple Silicon refuses to launch unsigned code.
          # Tauri refuses to build updater artifacts without the private key.
          node -e '
            const fs = require("fs"), p = "src-tauri/tauri.release.conf.json";
            const c = JSON.parse(fs.readFileSync(p, "utf8"));
            c.bundle.macOS.signingIdentity = "-";
            c.bundle.createUpdaterArtifacts = process.env.HAS_UPDATER_KEY === "true";
            fs.writeFileSync(p, JSON.stringify(c, null, 2) + "\n");
          '
          cat src-tauri/tauri.release.conf.json

      - name: Build sidecars
        run: |
          cargo build --release --target "$TARGET" -p buzz-acp -p buzz-agent -p buzz-backend-kubernetes -p buzz-dev-mcp -p git-credential-nostr -p buzz-cli
          ./scripts/bundle-sidecars.sh "$TARGET"

      - name: Build app and DMG
        run: cd desktop && pnpm tauri build --verbose --target "$TARGET" --bundles app,dmg --config src-tauri/tauri.release.conf.json
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
          MACOSX_DEPLOYMENT_TARGET: "10.15"
          CMAKE_OSX_DEPLOYMENT_TARGET: "10.15"
          TAURI_BUNDLER_DMG_IGNORE_CI: "true"

      - name: Verify signature
        run: |
          APP="desktop/src-tauri/target/$TARGET/release/bundle/macos/Dreamforge.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=4 "$APP"

      - name: Stage release files
        run: |
          BUNDLE="desktop/src-tauri/target/$TARGET/release/bundle"
          mkdir out
          cp "$BUNDLE"/dmg/*.dmg out/
          if [ "$HAS_UPDATER_KEY" = true ]; then
            cp "$BUNDLE/macos/Dreamforge.app.tar.gz" "out/Dreamforge_$ARCH.app.tar.gz"
            cp "$BUNDLE/macos/Dreamforge.app.tar.gz.sig" "out/Dreamforge_$ARCH.app.tar.gz.sig"
          fi
          ls -l out

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dreamforge-macos-${{ matrix.arch }}
          path: out/
          if-no-files-found: error

  windows:
    name: Windows x64
    if: github.repository == 'QuicksilverSlick/buzz'
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      TARGET: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: x86_64-pc-windows-msvc

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.1
          package-manager-cache: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.4.0

      - name: Install desktop dependencies
        run: pnpm install --frozen-lockfile

      - name: Set version
        if: env.VERSION != ''
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::version must be plain x.y.z, got '$VERSION'"; exit 1; }
          cd desktop && node scripts/set-version-from-tag.mjs "$VERSION"
          cd src-tauri && cargo update --workspace

      - name: Generate release config
        run: |
          if [ "$HAS_UPDATER_KEY" != true ]; then
            [ "$PUBLISH" != true ] || { echo "::error::publish needs the TAURI_SIGNING_PRIVATE_KEY secret"; exit 1; }
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set; building without updater artifacts"
          fi
          BUZZ_UPDATER_PUBLIC_KEY=$(cat desktop/src-tauri/dreamforge-updater.pub)
          export BUZZ_UPDATER_PUBLIC_KEY
          echo "BUZZ_UPDATER_PUBLIC_KEY=$BUZZ_UPDATER_PUBLIC_KEY" >> "$GITHUB_ENV"
          cd desktop && node scripts/build-release-config.mjs
          # Tauri refuses to build updater artifacts without the private key.
          node -e '
            const fs = require("fs"), p = "src-tauri/tauri.release.conf.json";
            const c = JSON.parse(fs.readFileSync(p, "utf8"));
            c.bundle.createUpdaterArtifacts = process.env.HAS_UPDATER_KEY === "true";
            fs.writeFileSync(p, JSON.stringify(c, null, 2) + "\n");
          '
          cat src-tauri/tauri.release.conf.json

      - name: Build sidecars
        run: |
          cargo build --release --target "$TARGET" -p buzz-acp -p buzz-agent -p buzz-dev-mcp -p git-credential-nostr -p buzz-cli
          ./scripts/bundle-sidecars.sh "$TARGET"

      - name: Build NSIS installer
        run: cd desktop && pnpm tauri build --verbose --target "$TARGET" --bundles nsis --config src-tauri/tauri.release.conf.json
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"

      - name: Stage release files
        run: |
          NSIS="desktop/src-tauri/target/$TARGET/release/bundle/nsis"
          mkdir out
          cp "$NSIS"/*-setup.exe out/
          if [ "$HAS_UPDATER_KEY" = true ]; then
            cp "$NSIS"/*-setup.exe.sig out/
          fi
          ls -l out

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dreamforge-windows-x64
          path: out/
          if-no-files-found: error

  publish:
    name: Publish
    if: github.repository == 'QuicksilverSlick/buzz' && github.event_name == 'workflow_dispatch' && inputs.publish
    needs: [macos, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency: dreamforge-desktop-publish
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: dreamforge-desktop-latest
    steps:
      - name: Refuse without the updater signing key
        if: env.HAS_UPDATER_KEY != 'true'
        run: |
          echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set; installed apps could not verify this release"
          exit 1

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dreamforge-*
          path: dist
          merge-multiple: true

      - name: Write latest.json
        run: |
          ls -l dist
          python3 scripts/release-latest-json.py --check "$VERSION" "$BUZZ_UPDATER_ENDPOINT"
          BASE="https://github.com/$GH_REPO/releases/download/$TAG"
          EXE="Dreamforge_${VERSION}_x64-setup.exe"
          for f in Dreamforge_aarch64.app.tar.gz Dreamforge_x64.app.tar.gz "$EXE"; do
            [ -s "dist/$f" ] || { echo "::error::missing dist/$f"; exit 1; }
          done
          python3 scripts/release-latest-json.py "$VERSION" \
            "darwin-aarch64=dist/Dreamforge_aarch64.app.tar.gz.sig=$BASE/Dreamforge_aarch64.app.tar.gz" \
            "darwin-x86_64=dist/Dreamforge_x64.app.tar.gz.sig=$BASE/Dreamforge_x64.app.tar.gz" \
            "windows-x86_64=dist/$EXE.sig=$BASE/$EXE" > latest.json
          cat latest.json

      - name: Upload to the rolling release
        env:
          NOTES: |
            Dreamforge desktop installers. Take the newest version number.

            **Windows:** download `Dreamforge_<version>_x64-setup.exe` and run it. If SmartScreen says "Windows protected your PC", click **More info**, then **Run anyway**.

            **Mac:** download the DMG for your chip (`aarch64` for Apple Silicon, `x64` for Intel), open it and drag Dreamforge to Applications. The first launch is blocked because the app is not notarized: open **System Settings**, **Privacy & Security**, and click **Open Anyway**.

            Installed apps update themselves from `latest.json` here.
        run: |
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --target "$GITHUB_SHA" --title "Dreamforge desktop" --notes "$NOTES"
          gh release upload "$TAG" dist/*.dmg dist/*.app.tar.gz dist/*.exe dist/*.sig --clobber
          # latest.json last, so apps only see the new version once every file it names is uploaded.
          gh release upload "$TAG" latest.json --clobber
